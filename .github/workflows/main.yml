name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        mode: [release, dev]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the linux tray icon talks to the desktop over dbus, so no gtk/appindicator packages are needed to build
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build deej (Windows)
        if: runner.os == 'Windows'
        run: pkg/deej/scripts/windows/build-${{ matrix.mode }}.bat
        shell: cmd

      - name: Build deej (Linux)
        if: runner.os == 'Linux'
        run: pkg/deej/scripts/linux/build-${{ matrix.mode }}.sh

      - name: Test
        if: matrix.mode == 'dev'
        run: go test ./...
